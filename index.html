<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal webpage and quantum logbook of Mister Matthews.">
  <title>Hello, Mister Matthews</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements (Crimson / Red Sci-Fi Aura) -->
  <div class="bg-glow bg-glow-1" aria-hidden="true"></div>
  <div class="bg-glow bg-glow-2" aria-hidden="true"></div>

  <!-- Main Hero Card -->
  <main class="container" id="main-content">
    <header class="header-section">
      <div class="system-status-pill">
        <span class="status-dot"></span>
        <span class="status-text">SYS.ONLINE // MATTHEWS.NET</span>
      </div>
      <h1 class="greeting-title" id="greeting">Hello, Mister Matthews</h1>
    </header>

    <div class="illustration-wrapper" aria-hidden="true">
      <svg class="cat-outline" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Line drawing of a black cat">
        <!-- Black Cat outline: contour lines -->
        <!-- Head & Ears -->
        <path class="cat-stroke" d="M68 82 L58 48 C57 44 61 41 65 43 L84 57 C92 54 108 54 116 57 L135 43 C139 41 143 44 142 48 L132 82 C142 94 146 112 142 128 C138 142 126 152 100 152 C74 152 62 142 58 128 C54 112 58 94 68 82Z" />
        
        <!-- Sleepy / Relaxed Eyes -->
        <path class="cat-stroke" d="M78 88 Q86 94 94 88" />
        <path class="cat-stroke" d="M106 88 Q114 94 122 88" />
        
        <!-- Nose & Mouth -->
        <path class="cat-stroke" d="M100 96 L100 102" />
        <path class="cat-stroke" d="M100 102 Q94 107 89 104" />
        <path class="cat-stroke" d="M100 102 Q106 107 111 104" />
        
        <!-- Whiskers -->
        <path class="cat-stroke whisker" d="M52 94 L72 96" />
        <path class="cat-stroke whisker" d="M50 103 L70 102" />
        <path class="cat-stroke whisker" d="M128 96 L148 94" />
        <path class="cat-stroke whisker" d="M130 102 L150 103" />

        <!-- Body & Front Paws -->
        <path class="cat-stroke" d="M72 148 C68 162 65 178 65 186 C65 188 67 190 70 190 H130 C133 190 135 188 135 186 C135 178 132 162 128 148" />
        <path class="cat-stroke" d="M92 155 V190" />
        <path class="cat-stroke" d="M108 155 V190" />
        
        <!-- Curled Tail -->
        <path class="cat-stroke tail" d="M135 186 C152 186 166 176 166 160 C166 148 156 142 148 146 C142 150 144 158 150 158" />
      </svg>
    </div>

    <footer class="contact-section">
      <a href="mailto:mrlukejmatthews@gmail.com" class="email-link" id="email-address" title="Send email transmission">
        <svg class="email-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
        mrlukejmatthews@gmail.com
      </a>
    </footer>
  </main>

  <!-- Collapsible Side Tab Button (Docked to Edge) -->
  <button id="drawer-toggle-btn" class="drawer-trigger-tab" aria-expanded="false" aria-controls="logbook-drawer" title="Toggle Quantum Logbook">
    <span class="tab-pulse-dot"></span>
    <span class="tab-text">LOGBOOK</span>
    <span class="tab-count-badge" id="tab-count-badge">--</span>
  </button>

  <!-- Backdrop Overlay -->
  <div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"></div>

  <!-- Collapsible Slide-Out Drawer -->
  <aside id="logbook-drawer" class="logbook-drawer" role="dialog" aria-modal="true" aria-label="Quantum Logbook Drawer" aria-hidden="true">
    <div class="drawer-inner">
      <div class="drawer-header">
        <div class="terminal-title-group">
          <span class="terminal-prompt">&gt;</span>
          <h2 class="terminal-title">QUANTUM LOGBOOK</h2>
        </div>
        <div class="drawer-header-actions">
          <span class="log-count-badge" id="log-count-badge">CONNECTING...</span>
          <button id="drawer-close-btn" class="drawer-close-btn" aria-label="Close Logbook Drawer">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="drawer-content">
        <form id="logbook-form" class="logbook-form">
          <div class="input-container">
            <input 
              type="text" 
              id="name-input" 
              class="sci-fi-input" 
              placeholder="ENTER CALLSIGN / IDENTIFIER..." 
              maxlength="60" 
              autocomplete="off" 
              required
            >
            <button type="submit" id="sign-btn" class="sci-fi-btn">
              <span id="sign-btn-text">SIGN LOGBOOK</span>
              <svg class="btn-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </button>
          </div>
          <div id="form-feedback" class="form-feedback" aria-live="polite"></div>
        </form>

        <!-- Signers Stream Feed -->
        <div class="log-feed-container">
          <div class="log-feed-label">TRANSMISSION ARCHIVE</div>
          <ul id="logbook-list" class="logbook-list">
            <div class="empty-log-state">
              <span class="pulse-indicator"></span>
              <p>SYNCING WITH FIRESTORE...</p>
            </div>
          </ul>
        </div>
      </div>
    </div>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
